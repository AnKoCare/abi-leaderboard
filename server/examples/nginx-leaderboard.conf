# Đoạn nginx cho bảng xếp hạng, rút gọn từ cấu hình Colony Flow đang chạy.
# Đặt trong khối `http` / `server` của nginx đứng trước app; đổi `backend` thành upstream của bạn.

# --- khối http ---
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m max_size=256m inactive=60m use_temp_path=off;
# 25/09/2026 Colony Flow: /rank từng quét hàng triệu dòng mỗi request, một đợt tra hạng ăn
# hết MySQL. Package đã tính hạng bằng histogram, nhưng vẫn nên giữ trần request đồng thời.
limit_conn_zone $server_name zone=rank_conn:1m;

# --- khối server ---

# /rank: KHÔNG cache (tránh cache bản null), chặn số request chạy cùng lúc.
location ^~ /api/v1/leaderboard/rank {
    limit_conn rank_conn 8;
    limit_conn_status 503;
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
}

# /top: công khai, giống hệt nhau cho mọi người chơi → cache 30 giây ngay ở edge.
#  - KHÔNG dùng proxy_cache_bypass $http_authorization: SDK gắn Bearer vào mọi request,
#    để mặc định thì mọi client đã đăng nhập đều bypass cache.
#  - Khoá cache bỏ Authorization → mọi người dùng chung một bản. An toàn vì endpoint này
#    không trả dữ liệu riêng của ai.
location ^~ /api/v1/leaderboard/top {
    proxy_cache api_cache;
    proxy_cache_methods GET HEAD;
    proxy_cache_key "$scheme$request_method$host$uri$is_args$args";
    proxy_cache_valid 200 30s;
    proxy_cache_valid 404 10s;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 5s;
    proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;
    proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
    proxy_hide_header Set-Cookie;
    add_header X-Cache-Status $upstream_cache_status always;
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
}
